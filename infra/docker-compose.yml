services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: logispace
      POSTGRES_USER: logispace
      POSTGRES_PASSWORD: logispace
    ports:
      - "5432:5432"
    volumes:
      - logispace_postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  logispace_postgres:
